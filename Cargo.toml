[package]
name = "kana-kilo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
csv = "1.1.6"
phf_codegen = "0.11.2"

[dependencies]
lazy_static = "1.4.0"
getrandom = { version = "0.2.3", features = ["js"] }
phf = "0.11.2"
rand = "0.8.4"
strum = { version = "0.23", features = ["derive"] }
yew = "0.18"
yewtil = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = 'abort'
